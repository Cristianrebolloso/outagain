<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Out Again</title>
  <meta http-equiv="refresh" content="0; url=./privacy/">
  <link rel="canonical" href="./privacy/">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050506;
      --panel: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.70);
      --accent: #a855f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(26, 110, 255, 0.26), transparent 28%),
        radial-gradient(circle at top right, rgba(232, 0, 154, 0.20), transparent 24%),
        radial-gradient(circle at bottom right, rgba(57, 255, 106, 0.12), transparent 24%),
        linear-gradient(135deg, #000000 0%, #050508 50%, #000000 100%);
      color: var(--text);
    }

    main {
      width: min(560px, 100%);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      color: var(--text);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Out Again</h1>
    <p>Redirecting to the privacy policy. If you are not redirected, <a href="./privacy/">tap here</a>.</p>
  </main>
</body>
</html>
